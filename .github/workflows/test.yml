name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            channel: msedge
          - os: ubuntu-latest
            channel: chromium
    runs-on: ${{ matrix.os }}
    env:
      BB_BROWSER_CHANNEL: ${{ matrix.channel }}
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - if: matrix.channel == 'chromium'
        run: npx playwright install --with-deps chromium
      - run: npm test
